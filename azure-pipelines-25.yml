# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: CavAITestCaseTask@1
  inputs:
    cavConnection: 'cav-ai-connection'
    workspaceRoot: '/'
    numberOfTestCases: '1'
    prdSourceType: 'LOCAL'
